<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Content Studio - Interface Prototype</title>
<link rel="icon" href="data:,">
<style>html{color-scheme:light dark}body{margin:0;padding:16px;background:light-dark(#f7f8fb,#181c23);font:14px/1.5 system-ui,sans-serif}@media(max-width:520px){body{padding:8px}}</style>
<script src="vendor/lucide.js"></script>
</head>
<body>
<div id="git-content-prototype">
<style>
#git-content-prototype .studio{--bg:light-dark(#f7f8fb,#181c23);--panel:light-dark(#fff,#242a34);--ink:light-dark(#263044,#eef1f8);--soft:light-dark(#657087,#aab4c9);--line:light-dark(#dde3ed,#3d4657);--accent:light-dark(#365bd4,#a8bbff);--tint:light-dark(#edf1fc,#303b58);--warn:light-dark(#925400,#ffd28a);font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;min-height:790px;position:relative}
#git-content-prototype .studio *{box-sizing:border-box}
#git-content-prototype .studio button,#git-content-prototype .studio input,#git-content-prototype .studio select,#git-content-prototype .studio textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 11px}
#git-content-prototype .studio button{display:inline-flex;align-items:center;justify-content:center;gap:7px}
#git-content-prototype .studio button:hover{background:var(--tint)}
#git-content-prototype .studio button.primary{background:var(--accent);border-color:var(--accent);color:light-dark(#fff,#15213e)}
#git-content-prototype .studio button:disabled{opacity:.45}
#git-content-prototype .studio input,#git-content-prototype .studio select,#git-content-prototype .studio textarea{width:100%;max-width:100%}
#git-content-prototype .studio textarea{resize:vertical;min-height:90px}
#git-content-prototype .studio h1,#git-content-prototype .studio h2,#git-content-prototype .studio h3,#git-content-prototype .studio p{margin:0}
#git-content-prototype .studio h1{font-size:25px;font-weight:500;letter-spacing:-.6px}
#git-content-prototype .studio h2{font-size:19px;font-weight:500}
#git-content-prototype .studio h3{font-size:15px;font-weight:500}
#git-content-prototype .studio label{display:block;margin:15px 0 6px}
#git-content-prototype .studio .small{font-size:12px;color:var(--soft)}
#git-content-prototype .studio .muted{color:var(--soft)}
#git-content-prototype .studio .row,#git-content-prototype .studio .spread{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#git-content-prototype .studio .spread{justify-content:space-between}
#git-content-prototype .studio .chrome{padding:17px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
#git-content-prototype .studio .brand{display:flex;align-items:center;gap:11px}
#git-content-prototype .studio .brandmark{background:var(--tint);color:var(--accent);width:33px;height:33px;border-radius:8px;display:grid;place-items:center}
#git-content-prototype .studio .nav{display:flex;gap:4px;flex-wrap:wrap}
#git-content-prototype .studio .nav button{border:0;background:transparent;color:var(--soft)}
#git-content-prototype .studio .nav button[aria-current=page]{background:var(--tint);color:var(--accent)}
#git-content-prototype .studio .page{padding:24px}
#git-content-prototype .studio .heading{margin-bottom:22px}
#git-content-prototype .studio .heading .muted{margin-top:5px}
#git-content-prototype .studio .timeline-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
#git-content-prototype .studio .timeline-layout.tree.selected{grid-template-columns:minmax(0,1fr) 255px}
#git-content-prototype .studio .timeline-layout.navigator{grid-template-columns:160px minmax(0,1fr)}
#git-content-prototype .studio .timeline-layout.navigator.selected{grid-template-columns:160px minmax(0,1fr) 240px}
#git-content-prototype .studio .graph{position:relative;min-height:380px;border:1px solid var(--line);background:var(--panel);border-radius:9px}
#git-content-prototype .studio .graph svg{position:absolute;inset:0;pointer-events:none;color:var(--line)}
#git-content-prototype .studio .node{position:absolute;display:flex;align-items:flex-start;flex-direction:column;min-height:60px;text-align:left;padding:9px;gap:2px;z-index:1}
#git-content-prototype .studio .node strong{font-size:13px;font-weight:500}
#git-content-prototype .studio .node small{font-size:12px;color:var(--soft)}
#git-content-prototype .studio .node.chosen{background:var(--tint);border-color:var(--accent)}
#git-content-prototype .studio .node.head:after{content:"";position:absolute;right:7px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
#git-content-prototype .studio .branch-nav button{display:flex;width:100%;justify-content:flex-start;text-align:left;margin-bottom:7px}
#git-content-prototype .studio .branch-nav button.active{background:var(--tint);color:var(--accent)}
#git-content-prototype .studio .detached{margin-top:22px;padding-top:15px;border-top:1px solid var(--line)}
#git-content-prototype .studio .detached .row{margin-top:10px}
#git-content-prototype .studio .detached button{display:flex;flex-direction:column;align-items:flex-start;min-width:150px}
#git-content-prototype .studio .inspector{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px;align-self:start;min-width:0}
#git-content-prototype .studio .inspector .small{margin:6px 0 15px}
#git-content-prototype .studio .inspector .row{margin-top:16px}
#git-content-prototype .studio .inspector p{overflow-wrap:anywhere}
#git-content-prototype .studio .inspector details{margin-top:14px}
#git-content-prototype .studio .inspector details button{display:flex;width:100%;margin-top:7px}
#git-content-prototype .studio .canvas .inspector{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px}
#git-content-prototype .studio .editor-layout{display:grid;grid-template-columns:175px minmax(0,1fr);gap:28px}
#git-content-prototype .studio .editor{min-width:0;max-width:720px}
#git-content-prototype .studio .revision-picker{display:flex;align-items:center;gap:6px}
#git-content-prototype .studio .revision-picker select{width:auto;max-width:240px}
#git-content-prototype .studio .field{padding:16px 0;border-bottom:1px solid var(--line)}
#git-content-prototype .studio .field label{margin:0 0 5px}
#git-content-prototype .studio .field .small{margin-bottom:8px}
#git-content-prototype .studio .field-tools{text-align:right;margin-top:5px}
#git-content-prototype .studio .field-tools button{font-size:12px;padding:3px 7px;background:transparent;border:0;color:var(--soft)}
#git-content-prototype .studio .media{padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:7px;display:flex;gap:12px;align-items:center;overflow-wrap:anywhere}
#git-content-prototype .studio .notice{margin:16px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--soft)}
#git-content-prototype .studio .cms-layout{display:grid;grid-template-columns:145px minmax(0,1fr) 240px;gap:18px}
#git-content-prototype .studio .sections button{width:100%;justify-content:flex-start;display:flex;margin-bottom:7px}
#git-content-prototype .studio .sections button.active{background:var(--tint)}
#git-content-prototype .studio .page-canvas{padding:20px;border:1px solid var(--line);border-radius:9px;min-width:0;background:var(--panel)}
#git-content-prototype .studio .block{padding:10px 8px;border:1px solid transparent;border-radius:5px;margin:7px 0;overflow-wrap:anywhere}
#git-content-prototype .studio .block.selected{background:var(--tint);border-color:var(--accent)}
#git-content-prototype .studio .block button{display:block;text-align:left;width:100%;border:0;padding:0;background:transparent}
#git-content-prototype .studio .block h2{font-size:27px}
#git-content-prototype .studio .source-label{display:block;margin-top:7px;color:var(--soft);font-size:12px}
#git-content-prototype .studio .binding{border-left:1px solid var(--line);padding-left:18px;min-width:0}
#git-content-prototype .studio .binding label{font-size:12px;color:var(--soft)}
#git-content-prototype .studio .warning{color:var(--warn);background:var(--tint);padding:12px;border-radius:7px;margin:12px 0;overflow-wrap:anywhere}
#git-content-prototype .studio .preview-frame{width:100%;min-height:480px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
#git-content-prototype .studio .status{padding:11px 24px;background:var(--panel);border-top:1px solid var(--line);color:var(--soft);font-size:12px}
#git-content-prototype .studio .backdrop{position:absolute;inset:0;background:light-dark(#20293866,#0008);z-index:10;padding:60px 18px 24px;display:flex;justify-content:center;align-items:flex-start;min-height:100%}
#git-content-prototype .studio .dialog{background:var(--panel);width:min(520px,100%);padding:24px;border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 36px #0002}
#git-content-prototype .studio .dialog p{margin-top:10px}
#git-content-prototype .studio .dialog-footer{margin-top:22px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#git-content-prototype .studio .code{font:12px/1.6 ui-monospace,monospace;min-height:220px}
@media(max-width:850px){#git-content-prototype .studio .cms-layout{grid-template-columns:130px minmax(0,1fr)}#git-content-prototype .studio .binding{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:16px 0}#git-content-prototype .studio .timeline-layout.navigator.selected{grid-template-columns:150px minmax(0,1fr)}#git-content-prototype .studio .navigator .inspector{grid-column:1/-1}}
@media(max-width:640px){#git-content-prototype .studio{min-height:1100px}#git-content-prototype .studio .page{padding:17px}#git-content-prototype .studio .chrome{padding:14px 17px;gap:10px}#git-content-prototype .studio .nav{width:100%;justify-content:space-between}#git-content-prototype .studio .nav button{padding:7px;font-size:13px}#git-content-prototype .studio .nav i{display:none}#git-content-prototype .studio .timeline-layout.tree.selected,#git-content-prototype .studio .timeline-layout.navigator,#git-content-prototype .studio .timeline-layout.navigator.selected,#git-content-prototype .studio .canvas .inspector,#git-content-prototype .studio .editor-layout,#git-content-prototype .studio .cms-layout{grid-template-columns:minmax(0,1fr)}#git-content-prototype .studio .branch-nav,#git-content-prototype .studio .sections{display:flex;flex-wrap:wrap;gap:5px}#git-content-prototype .studio .branch-nav button,#git-content-prototype .studio .sections button{width:auto;margin:0}#git-content-prototype .studio .revision-picker{width:100%}#git-content-prototype .studio .revision-picker select{min-width:0;flex:1;max-width:none}#git-content-prototype .studio input,#git-content-prototype .studio textarea,#git-content-prototype .studio select{font-size:16px}}
@media(pointer:coarse){#git-content-prototype .studio button{min-height:44px}#git-content-prototype .studio .field-tools button{padding:8px}#git-content-prototype .studio .revision-picker button{min-width:44px}}

#git-content-prototype .studio .timeline-stage{position:relative;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;isolation:isolate}
#git-content-prototype .studio .graph{height:560px;min-height:0;border:0;border-radius:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--panel);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
#git-content-prototype .studio .graph.panning{cursor:grabbing}
#git-content-prototype .studio .scene{position:absolute;inset:0;transform-origin:0 0;pointer-events:none}
#git-content-prototype .studio .tree-edges{position:absolute;overflow:visible;inset:0;width:1px;height:1px;color:var(--soft);pointer-events:none}
#git-content-prototype .studio .node-anchor{position:absolute;width:0;height:0}
#git-content-prototype .studio .node-hit{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border:0;background:transparent!important;padding:0;pointer-events:auto;border-radius:50%;display:grid;place-items:center}
#git-content-prototype .studio .node-dot{width:16px;height:16px;border:2px solid var(--soft);background:var(--panel);border-radius:50%;display:block}
#git-content-prototype .studio .node-hit.head .node-dot{width:24px;height:24px;border-color:var(--accent);background:var(--tint)}
#git-content-prototype .studio .node-hit[aria-pressed=true] .node-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--tint)}
#git-content-prototype .studio .node-label{position:absolute;left:29px;top:-21px;width:210px;text-align:left;pointer-events:none;opacity:0;visibility:hidden;background:var(--panel);padding:4px 7px;border-radius:5px;box-shadow:0 2px 6px light-dark(#2630440b,#0003)}
#git-content-prototype .studio .node-label strong,#git-content-prototype .studio .node-label small{display:block;overflow-wrap:anywhere}
#git-content-prototype .studio .node-label strong{font-size:14px;font-weight:500}
#git-content-prototype .studio .node-label small{font-size:12px;color:var(--soft)}
#git-content-prototype .studio .node-anchor.head .node-label,#git-content-prototype .studio .node-anchor:hover .node-label,#git-content-prototype .studio .node-anchor:focus-within .node-label,#git-content-prototype .studio .node-anchor.selected .node-label{opacity:1;visibility:visible}
#git-content-prototype .studio .area-label{position:absolute;pointer-events:none;color:var(--soft);font-size:12px;white-space:nowrap;transform-origin:0 0}
#git-content-prototype .studio .canvas-toolbar{position:absolute;left:15px;bottom:15px;display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:9px;z-index:3}
#git-content-prototype .studio .canvas-toolbar button{min-width:36px;padding:5px 9px}
#git-content-prototype .studio .canvas-toolbar output{font-size:12px;min-width:42px;text-align:center}
#git-content-prototype .studio .canvas-hint{position:absolute;left:18px;top:14px;color:var(--soft);font-size:12px;pointer-events:none;z-index:2}
#git-content-prototype .studio .timeline-stage .inspector{position:absolute;right:0;top:0;bottom:0;margin:0;height:100%;align-self:stretch;width:min(300px,calc(100% - 24px));z-index:5;border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:-8px 0 25px light-dark(#26304412,#0005);overflow-y:auto;animation:studio-drawer-in .17s ease-out}
#git-content-prototype .studio .timeline-stage .inspector:focus-within{z-index:6}
#git-content-prototype .studio .inspector .small{margin:6px 0 15px}
@keyframes studio-drawer-in{from{transform:translateX(100%)}to{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){#git-content-prototype .studio .timeline-stage .inspector{animation:none}}
@media(max-width:640px){#git-content-prototype .studio{min-height:790px}#git-content-prototype .studio .graph{height:570px}#git-content-prototype .studio .timeline-stage .inspector{width:calc(100% - 18px)}#git-content-prototype .studio .canvas-toolbar{left:9px;bottom:9px}#git-content-prototype .studio .canvas-hint{left:12px}}


#git-content-prototype .studio .image-field{margin-top:10px;min-width:0}
#git-content-prototype .studio .image-preview{width:100%;display:block;padding:12px;border:1px solid var(--line);background:var(--tint)}
#git-content-prototype .studio .image-preview img{display:block;width:100%;height:auto;max-height:280px;object-fit:contain}
#git-content-prototype .studio .image-empty{min-height:150px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;padding:20px;color:var(--soft);background:var(--panel)}
#git-content-prototype .studio .image-meta{margin-top:9px;font-size:12px;overflow-wrap:anywhere}
#git-content-prototype .studio .image-meta span{min-width:0}
#git-content-prototype .studio .image-actions{margin-top:12px}
#git-content-prototype .studio .dialog.media-dialog{width:min(840px,100%);min-width:0}
#git-content-prototype .studio .media-picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
#git-content-prototype .studio .media-picker input[type=file]{min-width:0;font-size:12px;padding:8px}
#git-content-prototype .studio .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:18px;max-height:350px;overflow-y:auto}
#git-content-prototype .studio .media-choice{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;min-width:0;text-align:left}
#git-content-prototype .studio .media-choice[aria-pressed=true]{background:var(--tint);border-color:var(--accent)}
#git-content-prototype .studio .media-choice img{display:block;width:100%;height:100px;object-fit:contain;background:var(--bg)}
#git-content-prototype .studio .media-choice span{font-size:12px;overflow-wrap:anywhere}
#git-content-prototype .studio .media-choice small{font-size:12px;color:var(--soft)}
#git-content-prototype .studio .picker-preview{min-width:0;padding-top:15px}
#git-content-prototype .studio .image-full{background:var(--tint);border-radius:8px;padding:12px;min-width:0}
#git-content-prototype .studio .image-full img{display:block;width:100%;height:auto;max-height:460px;object-fit:contain}
#git-content-prototype .studio .picker-preview .image-full img{height:270px;object-fit:contain}
#git-content-prototype .studio .media-name{overflow-wrap:anywhere;margin-top:10px!important}
#git-content-prototype .studio .bound-image{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}
#git-content-prototype .studio .inspector-image{display:block;width:100%;height:auto;max-height:170px;object-fit:contain;margin:12px 0}
@media(max-width:640px){#git-content-prototype .studio .media-picker{grid-template-columns:minmax(0,1fr);gap:12px}#git-content-prototype .studio .media-grid{max-height:220px}#git-content-prototype .studio .picker-preview .image-full img{height:200px}#git-content-prototype .studio .media-picker input[type=file]{font-size:16px}#git-content-prototype .studio .dialog.media-dialog{padding:18px}}


#git-content-prototype .studio .backdrop{position:fixed;inset:auto;margin:0;padding:12px;min-height:0;max-width:none;max-height:none;border:0;border-radius:0;background:transparent;display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:hidden;touch-action:none}
#git-content-prototype .studio .backdrop:not([open]){display:none}
#git-content-prototype .studio .backdrop::backdrop{background:light-dark(#20293866,#0008)}
#git-content-prototype .studio .backdrop .dialog{display:flex;flex-direction:column;max-height:100%;min-height:0;gap:16px;overflow:hidden;margin:0}
#git-content-prototype .studio .dialog-heading{flex:none}
#git-content-prototype .studio .modal-body{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;padding:1px 2px}
#git-content-prototype .studio .dialog-footer{flex:none;margin-top:0}
#git-content-prototype .studio .backdrop .image-full img{max-height:min(460px,calc(var(--modal-height) - 170px))}
#git-content-prototype .studio .media-grid{overscroll-behavior:contain}
#git-content-prototype .studio .viewport-probes{position:absolute;inset:0;pointer-events:none;overflow:hidden;visibility:visible}
@media(max-width:640px){#git-content-prototype .studio .backdrop{padding:8px}#git-content-prototype .studio .backdrop .dialog{padding:16px;gap:12px}}


#git-content-prototype .field-list{display:grid;gap:16px}
#git-content-prototype .managed-field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
#git-content-prototype .managed-field>div{min-width:0}
#git-content-prototype .managed-field p{overflow-wrap:anywhere}
#git-content-prototype .gallery-editor,#git-content-prototype .image-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px}
#git-content-prototype .gallery-editor figure,#git-content-prototype .image-gallery figure{margin:0;min-width:0}
#git-content-prototype .gallery-editor figcaption{overflow-wrap:anywhere;margin:8px 0}
#git-content-prototype .gallery-editor .image-preview{width:100%}
#git-content-prototype .image-gallery img{display:block;width:100%;max-height:320px;object-fit:contain}
#git-content-prototype .section-name{overflow-wrap:anywhere;min-width:0}
@media(max-width:520px){#git-content-prototype .managed-field{grid-template-columns:minmax(0,1fr)}}

#git-content-prototype .studio .field-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
#git-content-prototype .studio .field-heading>div:first-child{min-width:0;overflow-wrap:anywhere}
#git-content-prototype .studio .field-actions .icon-action{width:32px;height:32px;min-width:32px;padding:6px}
#git-content-prototype .studio .field-remove{display:flex;justify-content:flex-end;margin-top:8px}
#git-content-prototype .studio .field-remove button{color:var(--soft)}
#git-content-prototype .studio .editor-field-bar{margin-bottom:12px}

#git-content-prototype .studio .field-actions{gap:4px;flex-shrink:0}
#git-content-prototype .studio .icon-action i{display:inline-block;width:16px;height:16px}
@media(pointer:coarse){#git-content-prototype .studio .field-actions .icon-action{width:44px;height:44px;min-width:44px}}
</style>
<div id="studio-tree" class="studio"></div>
<script>
(()=>{
const root=document.getElementById('git-content-prototype'),copy=v=>structuredClone(v);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function refreshIcons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});root.querySelectorAll('[data-tooltip]').forEach(el=>el.title=el.dataset.tooltip);}
const ico=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const fields=(title,intro,body)=>[{id:'title',label:'Title',type:'text',value:title},{id:'intro',label:'Introduction',type:'markdown',value:intro},{id:'body',label:'Body',type:'markdown',value:body},{id:'cover',label:'Cover image',type:'media',value:''}];
function seed(){const nodes=[
{id:'n1',branch:'main',version:1,name:'First notes',parents:[],fields:fields('Quiet places','Places worth returning to.','Keep the observations simple. Let each place have its own voice.')},
{id:'n2',branch:'main',version:2,name:'Refined introduction',parents:['n1'],fields:fields('Field notes','A small guide to places that invite a pause.','Gather observations, photographs and directions for further exploration.')},
{id:'n3',branch:'main',version:3,name:'Clearer structure',parents:['n2'],fields:fields('Places to pause','An evolving guide to quiet places.','Start with a place. Notice its light, rhythm and small details. Record what is worth returning to.')},

if(act==='older'||act==='newer'){const list=['draft',...state.nodes.filter(n=>n.branch===active).reverse().map(n=>n.id)],index=list.indexOf(revision);revision=list[Math.max(0,Math.min(list.length-1,index+(act==='older'?1:-1)))];render();return;}

if(act==='connect'){const incoming=node(selected);modal('Connect detached work','<p>Keep its complete history and use its full content.</p>'+select('kind','Connection',opt('branch','New branch from a recorded node','branch')+opt('revision','Revision of an existing branch','branch'))+'<div data-id="connect-destination"></div>','Connect',box=>{const kind=box.querySelector('[data-input=kind]').value;let result;if(kind==='branch'){const parent=node(box.querySelector('[data-input=target-node]').value);branch(incoming.branch).detached=false;result=record(incoming.branch,incoming.fields,'Connected to '+branch(parent.branch).name+' v'+parent.version,[parent.id]);}else{const target=box.querySelector('[data-input=target-branch]').value;if(state.drafts[target].dirty)throw Error('Record the destination draft before attaching; it is retained.');branch(incoming.branch).detached=false;result=record(target,incoming.fields,'Connected '+branch(incoming.branch).name,[incoming.id]);}selected=result.id;status='Connection recorded. The original detached version and stamps are preserved.';});const box=q('.backdrop');function destination(){box.querySelector('[data-id=connect-destination]').innerHTML=box.querySelector('[data-input=kind]').value==='branch'?select('target-node','Connect to node',state.nodes.filter(n=>!branch(n.branch).detached).map(n=>opt(n.id,branch(n.branch).name+' · v'+n.version,'n3')).join('')):select('target-branch','Destination branch',state.branches.filter(b=>!b.detached).map(b=>opt(b.id,b.name,'main')).join(''));}box.querySelector('[data-input=kind]').onchange=destination;destination();return;}
if(act==='field-add'){modal('Add field',input('label','Label','New field')+input('id','Field ID','new-field')+select('type','Type',['text','markdown','media','gallery'].map(t=>opt(t,t==='gallery'?'Image gallery (multiple images)':t==='media'?'Image (single)':t,'text')).join('')),'Add field',box=>{const id=box.querySelector('[data-input=id]').value.trim(),draft=state.drafts[active];if(!/^[A-Za-z][A-Za-z0-9_-]*$/.test(id))throw Error('Use a field ID beginning with a letter.');if(draft.fields.some(f=>f.id===id))throw Error('This field ID is already used in this branch.');const type=box.querySelector('[data-input=type]').value;draft.fields.push({id,label:box.querySelector('[data-input=label]').value,type,value:type==='gallery'?[]:'',...(type==='gallery'?{mediaIds:[]}: {})});draft.dirty=true;status='Field added to draft.';});return;}
if(act.startsWith('remove:')){const draft=state.drafts[active];draft.fields=draft.fields.filter(f=>f.id!==act.slice(7));draft.dirty=true;tell('Field removed from draft; recorded versions remain intact.');render();return;}
if(act==='templates'){modal('Article content template','<p class="muted">Changes apply only to newly created content.</p>'+state.template.fields.filter(f=>f.type!=='media').map(f=>'<label>'+esc(f.label)+' · '+f.id+'</label><textarea data-template="'+f.id+'">'+esc(f.value)+'</textarea>').join(''),'Save template',box=>{box.querySelectorAll('[data-template]').forEach(el=>state.template.fields.find(f=>f.id===el.dataset.template).value=el.value);status='Template changed. Existing content is unchanged.';});return;}
if(act==='external'){const draft=state.drafts[active],f=draft.fields.find(f=>f.id==='body'),incoming='Updated externally: keep the observations direct and concise.';if(!f){tell('No body.md field in this draft.');return;}if(f.value===node(draft.base).fields.find(v=>v.id==='body')?.value){f.value=incoming;draft.dirty=true;status='External body.md edit loaded into the draft. No revision recorded.';render();}else modal('Conflicting body.md changes','<p>Both the current draft and external file changed.</p><label>Current draft</label><textarea readonly>'+esc(f.value)+'</textarea><label>External file</label><textarea readonly>'+esc(incoming)+'</textarea>'+select('keep','Keep',opt('draft','Current draft','draft')+opt('external','External file','draft')),'Resolve',box=>{if(box.querySelector('[data-input=keep]').value==='external')f.value=incoming;draft.dirty=true;status='Conflict resolved in the draft.';});return;}
if(act==='preview'){view='Preview';render();return;}if(act==='preview-toggle'){draftPreview=!draftPreview;render();return;}
if(act==='section-add'){const id='s'+Date.now();state.blocks.push({id,name:'New section',type:'paragraph',mode:'static',text:'New section'});blockID=id;render();return;}
if(act==='section-remove'){state.blocks=state.blocks.filter(b=>b.id!==blockID);blockID=state.blocks[0]?.id;render();return;}
if(act==='section-up'||act==='section-down'){const i=state.blocks.findIndex(b=>b.id===blockID),to=i+(act==='section-up'?-1:1);if(to>=0&&to<state.blocks.length){const [b]=state.blocks.splice(i,1);state.blocks.splice(to,0,b);}render();return;}
if(act==='code'){modal('HTML / CSS view','<label>Generated HTML</label><textarea class="code" readonly>'+esc(output(true))+'</textarea><label>Page CSS</label><textarea class="code" data-input="css">'+esc(state.css)+'</textarea>','Apply CSS',box=>{state.css=box.querySelector('[data-input=css]').value;status='Page styling updated.';});return;}
if(act==='export'){if(state.blocks.some(b=>resolve(b,false).error)){tell('Export blocked until missing or incompatible bindings are resolved.');return;}modal('Recorded export','<p class="muted">Recorded versions only. The current drafts are excluded.</p><textarea class="code" readonly>'+esc(output(false))+'</textarea>','Done',()=>{status='Recorded HTML reviewed. The prototype does not write project files.';});}
}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;lastModalTrigger=t;if(t.dataset.node&&e.detail>0&&performance.now()<ignoreClickUntil)return;if(t.dataset.view){view=t.dataset.view;render();}else if(t.dataset.node){selected=t.dataset.node;render();}else if(t.dataset.branch){activate(t.dataset.branch);selected=null;render();}else if(t.dataset.block){blockID=t.dataset.block;render();}else if(t.dataset.act&&!['cancel','save-modal'].includes(t.dataset.act))action(t.dataset.act);});
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){const draft=state.drafts[active];draft.fields.find(f=>f.id===t.dataset.field).value=t.value;draft.dirty=true;q('[data-id=draft-status]').textContent='Draft autosaved in this session · not recorded';tell('Draft updated. The recorded version is unchanged.');}if(t.dataset.input==='section-name'){const b=state.blocks.find(b=>b.id===blockID);b.name=t.value;const label=q('.sections [data-block="'+blockID+'"] .section-name');if(label)label.textContent=b.name||'Untitled section';}if(t.dataset.input==='static'){const b=state.blocks.find(b=>b.id===blockID);b.text=t.value;const el=q('[data-drag="'+blockID+'"] button');el.innerHTML=blockHTML(b,true)+'<span class="source-label">Static content</span>';}});
app.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-id=revision]')){revision=t.value;render();return;}const b=state.blocks.find(b=>b.id===blockID),id=t.dataset.input;if(!b||!['section-type','section-mode','source-branch','source-revision','source-field'].includes(id))return;if(id==='section-type')b.type=t.value;if(id==='section-mode'){b.mode=t.value;if(t.value==='dynamic'){b.branch=b.branch||'main';b.revision=b.revision||'latest';b.field=b.field||'title';}}if(id==='source-branch'){b.branch=t.value;b.revision='latest';b.field=node(branch(t.value).head).fields[0]?.id||'';}if(id==='source-revision')b.revision=t.value;if(id==='source-field')b.field=t.value;render();});
app.addEventListener('dragstart',e=>{const b=e.target.closest('[data-drag]');if(b)e.dataTransfer.setData('text/plain',b.dataset.drag);});app.addEventListener('dragover',e=>{if(e.target.closest('[data-drag]'))e.preventDefault();});app.addEventListener('drop',e=>{const t=e.target.closest('[data-drag]');if(!t)return;e.preventDefault();const from=state.blocks.findIndex(b=>b.id===e.dataTransfer.getData('text/plain')),to=state.blocks.findIndex(b=>b.id===t.dataset.drag);if(from>=0&&to>=0){const [b]=state.blocks.splice(from,1);state.blocks.splice(to,0,b);render();}});
app.addEventListener('keydown',e=>{if(e.key==='Escape'){if(q('.backdrop')){e.preventDefault();q('.backdrop').dismiss();}else if(view==='Timeline'&&selected){selected=null;render();}}if(view==='Timeline'&&!e.target.matches('input,textarea,select')&&!q('.backdrop')){const el=q('[data-id=graph]');if(e.key==='+'||e.key==='='){e.preventDefault();zoomAt(camera.scale*1.2,el.clientWidth/2,el.clientHeight/2);}if(e.key==='-'){e.preventDefault();zoomAt(camera.scale/1.2,el.clientWidth/2,el.clientHeight/2);}}});new ResizeObserver(()=>{if(view==='Timeline')requestAnimationFrame(graph);}).observe(app);render();
return {get state(){return state;},get view(){return view;},get activeBranch(){return active;},get camera(){return {...camera};},action,navigate(name){view=name;render();}};
}
root.prototypeApps=[setup(document.getElementById('studio-tree'),'tree')];
})();

name: Validate Myca canon metadata
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'mistune>=3,<4' Pillow
      - run: python scripts/validate.py
      - run: python scripts/canon_guard.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/resource_library.py validate --images
      - run: python scripts/build_site.py

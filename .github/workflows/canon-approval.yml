name: Myca canon approval gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

# This job executes ONLY trusted base code. Proposal files are read as Git
# objects; they are never checked out, imported, built, or executed here.
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: myca-canon-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  canon-approval:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify scoped creator approval and publish check on PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/canon_guard.py github-check
